services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false   # Copy .env.example to .env; the stack can still boot without it.
    ports:
      - "8000:8000"
    volumes:
      # Put SSH private keys in ./keys. The folder is git-ignored.
      - ./keys:/keys:ro
    extra_hosts:
      # Let the container reach a Phoenix mock running on the host.
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
